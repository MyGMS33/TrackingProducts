name: Collecter les prix (sans IA)
on:
  schedule:
    - cron: '15 9,21 * * *'
      timezone: 'Europe/Paris'
  push:
    branches: [main]
    paths:
      - 'tracker/**'
      - 'config/**'
      - '.github/workflows/track.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tracking-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TRACKING_CHROME_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - name: Tests unitaires du parseur Tractive
        run: python -m unittest discover -s tests -v
      - name: Vérifier Chrome installé sur le runner
        run: google-chrome --version
      - name: Relevé
        id: scrape
        run: |
          python tracker/collect.py || echo "failed=true" >> "$GITHUB_OUTPUT"
      - name: Publier données observées ou erreurs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: relevé automatique de prix'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Échec explicite
        if: steps.scrape.outputs.failed == 'true'
        run: exit 1

  publish:
    name: Actualiser le site après la collecte
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
